<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" width="100%" height="auto" role="img" aria-label="Caber Architecture Diagram (dark mode)">
  <defs>
    <pattern id="cb_dark_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#101e14" stroke-width="0.75" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.25" fill="#2f9e44" opacity="0.22"/>
    </pattern>

    <filter id="cb_dark_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="cb_dark_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132017" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#16251b" stop-opacity="0.90"/>
    </linearGradient>

    <marker id="cb_dark_arrow_teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2f9e44"/>
    </marker>
    <marker id="cb_dark_arrow_blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c5cff"/>
    </marker>
    <marker id="cb_dark_arrow_gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d99a2b"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 700; fill: #eef7ef; }
    .sub { font-size: 12px; font-weight: 500; fill: #a8b9ad; }
    .micro { font-size: 10.5px; font-weight: 500; fill: #8ba596; }
    .frame-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
    .pill-txt { font-size: 10px; font-weight: 600; letter-spacing: 0.03em; }
  </style>

  <!-- Background -->
  <rect width="1160" height="540" rx="12" fill="#060d09"/>
  <rect width="1160" height="540" rx="12" fill="url(#cb_dark_grid)"/>

  <!-- ========================================================================= -->
  <!-- 1. INGEST & CONTEXT PLANE (TOP)                                           -->
  <!-- ========================================================================= -->
  <g transform="translate(36, 36)">
    <rect x="0" y="0" width="1088" height="190" rx="10" fill="#0e1710" fill-opacity="0.65" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="16" y="-12" width="380" height="24" rx="4" fill="#060d09" stroke="#2f9e44" stroke-width="1.2"/>
    <text x="28" y="4" class="mono frame-lbl" fill="#2f9e44">
      1. INGEST &amp; CONTEXT INDEXING (ASYNCHRONOUS)
    </text>

    <!-- Node 1: Enterprise Sources -->
    <g transform="translate(28, 36)" filter="url(#cb_dark_shadow)">
      <rect x="0" y="0" width="310" height="126" rx="8" fill="url(#cb_dark_card)" stroke="rgba(211, 232, 216, 0.22)" stroke-width="1.2"/>
      <rect x="0" y="0" width="310" height="4" rx="2" fill="#2f9e44"/>
      <text x="20" y="32" class="sans title">1. Enterprise Data Sources</text>
      <text x="20" y="52" class="sans sub">Files, Email, Chat, Databases &amp; APIs</text>
      <line x1="20" y1="66" x2="290" y2="66" stroke="rgba(211, 232, 216, 0.12)" stroke-width="1"/>
      <text x="20" y="88" class="mono micro">• S3 / GCS / Azure, SQL, Drive, Mail</text>
      <text x="20" y="106" class="mono micro">• Captures source ACLs &amp; timestamps</text>
    </g>

    <path d="M 338 99 L 382 99" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#cb_dark_arrow_teal)"/>

    <!-- Node 2: Sentence-Level Fragmentation -->
    <g transform="translate(390, 36)" filter="url(#cb_dark_shadow)">
      <rect x="0" y="0" width="310" height="126" rx="8" fill="url(#cb_dark_card)" stroke="rgba(211, 232, 216, 0.22)" stroke-width="1.2"/>
      <rect x="0" y="0" width="310" height="4" rx="2" fill="#2f9e44"/>
      <text x="20" y="32" class="sans title">2. Content Fingerprinting</text>
      <text x="20" y="52" class="sans sub">Sentence-Sized Fragments (64B–820B)</text>
      <line x1="20" y1="66" x2="290" y2="66" stroke="rgba(211, 232, 216, 0.12)" stroke-width="1"/>
      <text x="20" y="88" class="mono micro">• Deterministic content identity</text>
      <text x="20" y="106" class="mono micro">• Links duplicate copies across files</text>
    </g>

    <path d="M 700 99 L 744 99" fill="none" stroke="#2f9e44" stroke-width="2.2" marker-end="url(#cb_dark_arrow_teal)"/>

    <!-- Node 3: Context Graph & Version History -->
    <g transform="translate(752, 36)" filter="url(#cb_dark_shadow)">
      <rect x="0" y="0" width="310" height="126" rx="8" fill="url(#cb_dark_card)" stroke="#d99a2b" stroke-width="1.5"/>
      <rect x="0" y="0" width="310" height="4" rx="2" fill="#d99a2b"/>
      <text x="20" y="32" class="sans title">3. Context Graph &amp; Versions</text>
      <text x="20" y="52" class="sans sub">Provenance, Lineage &amp; Freshness</text>
      <line x1="20" y1="66" x2="290" y2="66" stroke="rgba(211, 232, 216, 0.12)" stroke-width="1"/>
      <text x="20" y="88" class="mono micro">• Combines context from every copy</text>
      <text x="20" y="106" class="mono micro">• Resolves current vs. stale versions</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CROSS-PLANE SYNC CONNECTOR                                                -->
  <!-- ========================================================================= -->
  <path d="M 943 198 L 943 268 L 580 268 L 580 342" fill="none" stroke="#d99a2b" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#cb_dark_arrow_gold)"/>
  <g transform="translate(760, 268)">
    <rect x="-155" y="-13" width="310" height="26" rx="5" fill="#060d09" stroke="#d99a2b" stroke-width="1.2"/>
    <text x="0" y="4" class="mono pill-txt" fill="#d99a2b" text-anchor="middle">
      SYNCED CONTEXT &amp; COMPILED POLICY BUNDLE
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. RUNTIME ENFORCEMENT PLANE (BOTTOM)                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(36, 314)">
    <rect x="0" y="0" width="1088" height="190" rx="10" fill="#0e1710" fill-opacity="0.65" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="16" y="-12" width="430" height="24" rx="4" fill="#060d09" stroke="#7c5cff" stroke-width="1.2"/>
    <text x="28" y="4" class="mono frame-lbl" fill="#7c5cff">
      2. IN-PROCESS RUNTIME ENFORCEMENT (INFERENCE TIME)
    </text>

    <!-- Node 4: Agent / Tool / Retrieval Call -->
    <g transform="translate(28, 36)" filter="url(#cb_dark_shadow)">
      <rect x="0" y="0" width="310" height="126" rx="8" fill="url(#cb_dark_card)" stroke="rgba(211, 232, 216, 0.22)" stroke-width="1.2"/>
      <rect x="0" y="0" width="310" height="4" rx="2" fill="#7c5cff"/>
      <text x="20" y="32" class="sans title">4. Agent, MCP, or API Call</text>
      <text x="20" y="52" class="sans sub">Zero-Code Interception (pycaber)</text>
      <line x1="20" y1="66" x2="290" y2="66" stroke="rgba(211, 232, 216, 0.12)" stroke-width="1"/>
      <text x="20" y="88" class="mono micro">• On-Behalf-Of (OBO) user identity</text>
      <text x="20" y="106" class="mono micro">• Declared purpose &amp; trace context</text>
    </g>

    <path d="M 338 99 L 382 99" fill="none" stroke="#7c5cff" stroke-width="2.2" marker-end="url(#cb_dark_arrow_blue)"/>

    <!-- Node 5: In-Process Policy Evaluation -->
    <g transform="translate(390, 36)" filter="url(#cb_dark_shadow)">
      <rect x="0" y="0" width="310" height="126" rx="8" fill="url(#cb_dark_card)" stroke="#7c5cff" stroke-width="1.6"/>
      <rect x="0" y="0" width="310" height="4" rx="2" fill="#7c5cff"/>
      <text x="20" y="32" class="sans title">5. In-Process Policy Engine</text>
      <text x="20" y="52" class="sans sub">Compiled Rego (Wasm) in Process</text>
      <line x1="20" y1="66" x2="290" y2="66" stroke="rgba(211, 232, 216, 0.12)" stroke-width="1"/>
      <text x="20" y="88" class="mono micro">• Checks context, user &amp; purpose</text>
      <text x="20" y="106" class="mono micro">• Zero network or DB calls on path</text>
    </g>

    <path d="M 700 99 L 744 99" fill="none" stroke="#7c5cff" stroke-width="2.2" marker-end="url(#cb_dark_arrow_blue)"/>

    <!-- Node 6: Inline Mutation & Audit Receipt -->
    <g transform="translate(752, 36)" filter="url(#cb_dark_shadow)">
      <rect x="0" y="0" width="310" height="126" rx="8" fill="url(#cb_dark_card)" stroke="rgba(211, 232, 216, 0.22)" stroke-width="1.2"/>
      <rect x="0" y="0" width="310" height="4" rx="2" fill="#2f9e44"/>
      <text x="20" y="32" class="sans title">6. Inline Action &amp; Audit</text>
      <text x="20" y="52" class="sans sub">Sub-Document Control Before Model</text>
      <line x1="20" y1="66" x2="290" y2="66" stroke="rgba(211, 232, 216, 0.12)" stroke-width="1"/>
      <text x="20" y="88" class="mono micro">• Release, mask, replace, or withhold</text>
      <text x="20" y="106" class="mono micro">• Emits signed Audit V2 receipt</text>
    </g>
  </g>
</svg>
